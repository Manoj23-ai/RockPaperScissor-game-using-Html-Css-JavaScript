
<!DOCTYPE html>
<html lang="en">
<head>
    <title>ROCK PAPER SCISSORS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px 15px;
        }

        h3 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
        }

        /* Selection buttons */
        body > button:not(:last-of-type) {
            background: white;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            margin: 10px;
            transition: 0.3s;
            border: 4px solid #00d4ff;
        }

        body > button:not(:last-of-type):hover {
            transform: scale(1.12);
            box-shadow: 0 0 20px #00d4ff;
        }

        img {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        .you {
            font-size: 25px;
            font-weight: bold;
            margin-top: 35px;
            color: #00ff99;
        }

        .computer {
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .computer img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: contain;
            background: white;
            border: 4px solid #00d4ff;
            padding: 10px;
        }

        .js-score {
            font-size: 22px;
            font-weight: bold;
            margin-top: 35px;
            color: #ffd700;
        }

        /* Reset button */
        body > button:last-of-type {
            background: #ff4757;
            color: white;
            font-size: 16px;
            padding: 12px 25px;
            border-radius: 25px;
            margin-top: 20px;
            transition: 0.3s;
        }

        body > button:last-of-type:hover {
            background: #ff2538;
            transform: scale(1.05);
        }

    </style>
</head>

<body>
    <h3>Select one of the following:</h3>

    <button onclick="playerMove('rock')">
        <img src="images/rock.png">
    </button>

    <button onclick="playerMove('paper')">
        <img src="images/paper.png">
    </button>

    <button onclick="playerMove('scissor')">
        <img src="images/scissor.png">
    </button>

    <p class="you"></p>
    <p class="computer"></p>
    <p class="js-score"></p>

    <button onclick="score.win=0;
                     score.loss=0;
                     score.tie=0;
                     localStorage.removeItem('score');
                     updateScore();">
        Reset Score
    </button>

    <script>
        // we use LocalStorage
        const score = JSON.parse(localStorage.getItem('score')) || {
            win: 0,
            loss: 0,
            tie: 0,
        };

        updateScore();

        function updateScore() {
            document.querySelector('.js-score').innerHTML =
                `wins: ${score.win}, losses: ${score.loss}, tie: ${score.tie}`;
        }

        function playerMove(player) {
            const computerGuess = computerMove();
            let result = '';

            if (player === 'scissor') {
                if (computerGuess === 'rock') {
                    result = 'You Lost';
                } else if (computerGuess === 'paper') {
                    result = 'You Win';
                } else {
                    result = 'Tie';
                }
            }
            else if (player === 'paper') {
                if (computerGuess === 'rock') {
                    result = 'You Win';
                } else if (computerGuess === 'paper') {
                    result = 'Tie';
                } else {
                    result = 'You Lost';
                }
            }
            else if (player === 'rock') {
                if (computerGuess === 'rock') {
                    result = 'Tie';
                } else if (computerGuess === 'paper') {
                    result = 'You Lost';
                } else {
                    result = 'You Win';
                }
            }

            if (result === 'You Win') {
                score.win += 1;
            } else if (result === 'You Lost') {
                score.loss += 1;
            } else {
                score.tie += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            document.querySelector('.you').innerHTML = result;

            document.querySelector('.computer').innerHTML =
                `YOU <img src="images/${player}.png">
                <img src="images/${computerGuess}.png"> COMPUTER`;

            updateScore();
        }

        function computerMove() {
            const RandomNumber = Math.random();
            let computerGuess = '';

            if (RandomNumber >= 0 && RandomNumber < 1/3) {
                computerGuess = 'rock';
            } else if (RandomNumber >= 1/3 && RandomNumber < 2/3) {
                computerGuess = 'paper';
            } else {
                computerGuess = 'scissor';
            }

            return computerGuess;
        }
    </script>

</body>
</html>
